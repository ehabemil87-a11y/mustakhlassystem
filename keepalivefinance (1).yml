name: Keep Supabase Awake (Finance)

# نبضة يومية للمشروعين الماليين (طلبات الصرف + المستخلصات) حتى لا يدخلا سبات
# الباقة المجانية. يجرّب المفتاحين العامّين (publishable) على كل مشروع ويقبل
# أول استجابة 200 — فلا يهمّ أي مفتاح لأي مشروع. مفاتيح publishable عامة وآمنة.

on:
  schedule:
    - cron: '17 6 * * *'   # يوميًا ~6:17 UTC
  workflow_dispatch:        # تشغيل يدوي للتجربة

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping finance projects
        run: |
          KA="sb_publishable_Dsc1qBUk2BmAH4qpyo5ZNQ_YEmnUJKk"
          KB="sb_publishable_s_Z0HGnD8TmrSlsw4iFWeg_X7gu7Hki"

          ping() {
            proj="$1"; label="$2"; last=000
            for KEY in "$KA" "$KB"; do
              last=$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://$proj.supabase.co/rest/v1/sla_settings?select=id&limit=1" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" --max-time 25 || echo 000)
              if [ "$last" = "200" ]; then echo "$label ($proj): OK 200"; return 0; fi
            done
            echo "$label ($proj): FAILED (last=$last)"; return 1
          }

          rc=0
          ping "cnuumtyjquehftzvvoob" "extracts"     || rc=1
          ping "mwppgpllmtxfqxmgmyju" "disbursement" || rc=1
          exit $rc
